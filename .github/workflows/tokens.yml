name: Tokens lock

on:
  push:

permissions:
  contents: read

jobs:
  tokens-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tokens.css against tokens.lock
        run: python scripts/sync_tokens.py --check
